<script>
  let selectedRole = 'patient';


  

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    document.getElementById('errorText').textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
  }

async function handleLogin() {
  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');

  hideError();

  if (!email || !password) {
    showError('Please enter your email and password.');
    return;
  }

  btn.textContent = 'Signing in...';
  btn.disabled = true;

  try {
    let endpoint = "";

    // 🔥 Choose API based on role
    if (selectedRole === "admin") {
      endpoint = "https://digihealth-6uy7.onrender.com/api/super-admin/login/admin";
    } 
    else if (selectedRole === "hmo") {
      endpoint = "https://digihealth-6uy7.onrender.com/api/hmo/login";
    } 
    else if (selectedRole === "patient") {
      endpoint = "https://digihealth-6uy7.onrender.com/api/auth/patient/login";
    } 
    else if (selectedRole === "service-provider") {
      endpoint = "https://digihealth-6uy7.onrender.com/api/auth/provider/login";
    }

    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();


    console.log(response.status);
    console.log(data);

    // ❌ Handle errors
    if (!response.ok) {
      showError(data.message || "Login failed");
      btn.textContent = "Sign In";
      btn.disabled = false;
      return;
    }

    console.log("Login successful:", data);
    
    // ✅ Save session
    localStorage.setItem("dh_user", JSON.stringify({
      email: email,
      role: selectedRole,
      token: data.accessToken || data.token || data.jwt || null,
      loggedIn: true
    }));

    // ✅ Redirect per role
    const routes = {
      admin: "Dashboards/dashboard-admin.html",
      hmo: "Dashboards/dashboard-hmo-admin.html",
      patient: "Dashboards/dashboard-patient.html",
      "service-provider": "Dashboards/dashboard-caregiver.html"
    };

    window.location.href = routes[selectedRole];

  } catch (error) {
    showError("Network error. Please try again.");
    btn.textContent = "Sign In";
    btn.disabled = false;
  }
}
  
</script>
